spring.application.name=backend

# MySQL
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:db_server}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:int221}

# Hibernate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Error config
server.error.include-stacktrace=on_param

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:40MB}
spring.servlet.multipart.file-size-threshold=${FILE_SIZE_THRESHOLD:512KB}

# File storage path
file.upload-dir=./images
