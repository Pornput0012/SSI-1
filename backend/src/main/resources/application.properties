spring.application.name=backend

# Database settings can be supplied by Docker Compose or environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/INT221?serverTimezone=Asia/Bangkok}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=200MB

spring.servlet.multipart.max-request-size=800MB

spring.servlet.multipart.file-size-threshold=512KB

file.upload-dir=${FILE_UPLOAD_DIR:./picture}
file.support-type=image/png,image/jpg

host.url=${APP_HOST_URL:http://localhost:5173}

# Hibernate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Error config
server.error.include-stacktrace=on-param

app.cors.allowedOrigins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:false}

jwt.secret-verify-email=${JWT_SECRET_VERIFY_EMAIL:dev-only-verify-email-secret-change-me}
jwt.secret-reset-password=${JWT_SECRET_RESET_PASSWORD:dev-only-reset-password-secret-change-me}
jwt.secret-access=${JWT_SECRET_ACCESS:dev-only-access-token-secret-change-me}
jwt.secret-refresh=${JWT_SECRET_REFRESH:dev-only-refresh-token-secret-change-me}
jwt.issuer=${JWT_ISSUER:http://localhost:5173}

# Actuator & Prometheus Metrics
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=2s
management.metrics.tags.application=ssi1
